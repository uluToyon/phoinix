context.properties = {
    # Keep the graph at 48 kHz so the HDMI->TV->optical->soundbar chain
    # never has to switch rates (avoids resample clicks). No forced quantum:
    # PipeWire negotiates a power-of-two quantum the AMD HDMI batch device
    # can actually follow. Forcing quantum=500 caused the drift/cutout.
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
}
