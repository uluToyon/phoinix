# Combine sink: the Teufel Concept 12 (5.1) plus any connected Bluetooth
# device (stereo, FL/FR), latency-compensated. One default sink, so a game or
# a film plays on the bar and on the headphones at once without re-routing.
# See docs/LOG.md 2026-09-16 for the rationale.
#
# Host-specific by nature: it names the Concept 12 by its ALSA node name, which
# PipeWire builds from the USB vendor and product string — stable across
# reboots and ports, not a card index. The Bluetooth side is a pattern, so any
# paired device joins without being named here.
context.modules = [
{   name = libpipewire-module-combine-stream
    args = {
        combine.mode = sink
        node.name = "combine_sink"
        node.description = "Teufel + Bluetooth"
        combine.latency-compensate = true
        combine.props = {
            audio.position = [ FL FR FC LFE RL RR ]
            device.icon-name = "audio-speakers"
            device.form-factor = "speaker"
            priority.session = 2000
            priority.driver = 2000
        }
        stream.rules = [
            {   matches = [ { media.class = "Audio/Sink"
                              node.name = "alsa_output.usb-NXP_SEMICONDUCTORS_Teufel_CONCEPT_12-00.analog-surround-51" } ]
                actions = { create-stream = {
                    combine.audio.position = [ FL FR FC LFE RL RR ]
                    audio.position = [ FL FR FC LFE RL RR ]
                } }
            }
            {   matches = [ { media.class = "Audio/Sink"
                              node.name = "~bluez_output.*" } ]
                actions = { create-stream = {
                    combine.audio.position = [ FL FR ]
                    audio.position = [ FL FR ]
                } }
            }
        ]
    }
}
]
