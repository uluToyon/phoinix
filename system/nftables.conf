#!/usr/bin/nft -f
# Template — stage 2 installs this with @VPN_INTERFACE@ and @VPN_GROUP@
# substituted from config.sh. Do not edit the copy in /etc.
#
# This is the ONLY firewall rule the machine has, and that is deliberate.
# `plasma-firewall` is rejected in packages/kde.txt and nothing here filters
# incoming traffic: the policy stays `accept`, so enabling nftables.service
# does NOT hand the machine a security posture it never had. In particular the
# SSH access stage 2 sets up for the laptop keeps working exactly as before.
#
# What it does do is provide one guarantee, and provide it in the kernel:
# a process running with the @VPN_GROUP@ group may reach the network ONLY
# through the VPN tunnel.
#
# Why not simply qBittorrent's own "bind to interface" setting: that is the
# application promising something about itself. It does not survive a bug in
# the application, an update that resets the option, or a mistyped setting —
# and it never covered name resolution at all. This does, because the packet
# is dropped before it reaches the wire. The application setting is written
# too, as the first of two lines; this is the one that is load-bearing.

flush ruleset

table inet phoinix_vpnonly {
    chain output {
        type filter hook output priority filter; policy accept;

        # Loopback is not an escape hatch, it is the design. qBittorrent's DNS
        # goes to the systemd-resolved stub on 127.0.0.53, and resolved — not
        # being in this group — then queries Proton's resolver through the
        # tunnel itself. The port-forwarding service reaches qBittorrent's
        # WebUI the same way. Both must work, neither leaves the machine.
        oifname "lo" accept

        # The rule. `inet` so one line covers IPv4 and IPv6: the NL server has
        # IPv6 and the CH one does not, and a half-covered family would be
        # exactly the kind of hole this table exists to close.
        # `counter` so `nft list ruleset` shows whether it has ever fired,
        # which is what makes the guarantee testable instead of merely claimed.
        meta skgid "@VPN_GROUP@" oifname != "@VPN_INTERFACE@" counter drop
    }
}
