#!/usr/bin/nft -f
# Template — stage 2 installs this with @VPN_INTERFACE@ and @VPN_GROUP@
# substituted from config.sh. Do not edit the copy in /etc.
#
# This is the ONLY firewall rule the machine has, and that is deliberate.
# `plasma-firewall` is rejected in packages/kde.txt and nothing here filters
# incoming traffic: the policy stays `accept`, so enabling nftables.service
# does NOT hand the machine a security posture it never had. In particular the
# SSH access stage 2 sets up for the laptop keeps working exactly as before.
#
# What it does do is provide one guarantee, and provide it in the kernel:
# a process running with the @VPN_GROUP@ group may reach the network ONLY
# through the VPN tunnel.
#
# Why not simply qBittorrent's own "bind to interface" setting: that is the
# application promising something about itself. It does not survive a bug in
# the application, an update that resets the option, or a mistyped setting —
# and it never covered name resolution at all. This does, because the packet
# is dropped before it reaches the wire. The application setting is written
# too, as the first of two lines; this is the one that is load-bearing.

flush ruleset

table inet phoinix_vpnonly {
    # Steer the group into the tunnel. `type route` rather than plain filter,
    # because the kernel only re-runs the routing decision for a packet whose
    # mark changed in a route-type chain — setting the mark anywhere else would
    # label the packet without moving it.
    chain mark_out {
        type route hook output priority mangle; policy accept;

        # WireGuard's own encapsulated packets first, and this ordering is the
        # whole point: they inherit the group of the process that caused them,
        # so without this line they would be marked, routed back into the
        # tunnel, encapsulated again — a loop.
        meta mark @VPN_MARK_WG@ counter return

        # `counter` here is not decoration. When the tunnel stayed unused it was
        # this number that said whether the packets were never marked or marked
        # and then lost — the drop counter alone cannot tell those apart.
        meta skgid "@VPN_GROUP@" counter meta mark set @VPN_MARK_APP@
    }

    # Name lookups. Added 2026-08-06, and it closes the one hole the rest of
    # this table never covered: the group's PACKETS went through the tunnel
    # while its NAMES did not. qBittorrent asks the systemd-resolved stub on
    # 127.0.0.53, the loopback rule below lets that through, and resolved — not
    # being in this group — then asks Quad9 over the ordinary line. Every
    # tracker qBittorrent looked up was therefore visible to a resolver reached
    # over the normal connection.
    #
    # glibc has no per-process resolver, so this cannot live in a configuration
    # file. The destination is rewritten instead — to another LOOPBACK address,
    # which is the whole trick. Pointing it straight at the tunnel's resolver
    # was tried first and fails: the query already carries 127.0.0.1 as its
    # source by the time any rule sees it, and a loopback sender may not be
    # routed out of a real interface. Rewriting loopback to loopback keeps the
    # packet on `lo`, where that problem does not exist.
    #
    # @VPN_DNS_STUB@ is a dnsmasq running as group @VPN_GROUP@. Its own queries
    # to the tunnel's resolver get a proper source address, are marked by
    # mark_out like everything else from the group, and leave through the
    # tunnel. Matching the stub address exactly also keeps the forwarder's own
    # upstream traffic out of this rule — otherwise it would rewrite its way
    # back to itself.
    #
    # Fails CLOSED: with the tunnel down the forwarder gets no answer, so
    # nothing resolves rather than resolving over the wrong line.
    chain dns_out {
        type nat hook output priority dstnat; policy accept;

        meta skgid "@VPN_GROUP@" ip daddr 127.0.0.53 \
            meta l4proto { tcp, udp } th dport 53 \
            counter dnat ip to @VPN_DNS_STUB@
    }

    # POSTROUTING, not OUTPUT — and that distinction is the whole reason this
    # works at all. A `route` chain does not reroute the packet when it sets
    # the mark; the manual is precise about it: the new route lookup happens
    # once the packet "is about to be accepted", i.e. at the END of the output
    # hook. A filter chain sitting inside that hook therefore still sees the
    # OLD output interface. The first version dropped there, and the counters
    # said so exactly: the same 7 packets marked and dropped in one pass.
    # By postrouting the reroute has happened and `oifname` is the truth.
    chain postrouting {
        type filter hook postrouting priority filter; policy accept;

        # Loopback is not an escape hatch, it is the design — and since
        # 2026-08-06 it is load-bearing rather than merely tolerated. The
        # group's DNS is rewritten by dns_out from one loopback address to
        # another and is answered by a forwarder on this machine; nothing here
        # reaches the wire. Whatever that forwarder then asks upstream is a
        # separate packet, from a process in this group, and is marked and
        # dropped by the same rules as everything else.
        oifname "lo" accept

        # The tunnel's own traffic. It MUST leave over the ordinary interface —
        # that is what a tunnel is — and it carries the group of whatever
        # process caused it. The first version of this table had no such line
        # and therefore dropped the encryption of the very packets it was
        # meant to protect: measured on the live desktop as 7 dropped packets
        # per connection attempt, with the route correctly pointing at the
        # tunnel. Matching on WireGuard's own fwmark rather than on a port
        # number keeps the exception exact — nothing else ever sets this mark.
        meta mark @VPN_MARK_WG@ accept

        # The rule. `inet` so one line covers IPv4 and IPv6: the NL server has
        # IPv6 and the CH one does not, and a half-covered family would be
        # exactly the kind of hole this table exists to close.
        # `counter` so `nft list ruleset` shows whether it has ever fired,
        # which is what makes the guarantee testable instead of merely claimed.
        meta skgid "@VPN_GROUP@" oifname != "@VPN_INTERFACE@" counter drop
    }
}
