# Drop-in: stop plasmashell hanging for 40s on every shutdown.
#
# Observed teardown (journal, 2026-07-31, reproducible in every session):
#   logind SIGHUPs the session -> kwin loses DRM master -> plasmashell logs
#   "context kaput" (its Wayland connection is gone) -> ONLY THEN does systemd
#   send it SIGTERM, which it never processes because its event loop is dead
#   -> KDE's own TimeoutSec=40sec expires -> SIGKILL. The user manager, and
#   with it the whole shutdown, waits out those 40 seconds.
#
# Two measures, deliberately together:
#
# 1. After= kwin: upstream orders plasmashell against ksmserver and kcminit,
#    but NOT against the compositor, so both are torn down concurrently and
#    kwin can win. systemd stops in reverse After= order, so this makes
#    plasmashell go down BEFORE kwin — it still has a compositor when it is
#    asked to quit. This is the actual fix, and it may well be a no-op: the
#    teardown was started by logind, which does not honour systemd ordering.
#
# 2. TimeoutStopSec: the safety net for when (1) is a no-op. Not a behaviour
#    change so much as an admission of the status quo — plasmashell is already
#    never exiting on its own here, it is killed either way. This only shortens
#    the pointless wait before the kill. 10s is generous enough that a genuine
#    clean exit (logout rather than reboot) still completes normally.
#
# Which one did the work is visible in the journal: with (1) effective there is
# no "stop-sigterm timed out" line at all; with only (2) the line is still there
# but ~10s after the stop instead of ~40s.

[Unit]
After=plasma-kwin_wayland.service

[Service]
TimeoutStopSec=10s
