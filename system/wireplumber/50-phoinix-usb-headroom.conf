# USB audio needs headroom. USB is a batch device: the host controller can only
# hand over data in whole isochronous slots, so a late wakeup is not recoverable
# the way it is on a PCI card. Without headroom PipeWire aims at the last
# possible moment, and under game load (GPU at 100 %, audio threads on
# SCHED_OTHER) it misses. See LOG.md 2026-08-02.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb.*" }
      { node.name = "~alsa_input.usb.*" }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 2048
      }
    }
  }
]
