# USB audio: interrupt-driven, with headroom.
#
# api.alsa.disable-tsched — PipeWire's default is timer-based scheduling: it
# predicts when the device will need data and wakes itself. Under game load
# that prediction degrades, the control loop wanders, and after two to three
# minutes it is far enough off to double or drop samples. That is audible as
# crackling and invisible everywhere else: the graph reports no xrun, the kernel
# reports no USB error, and a capture of the digital stream is clean, because
# the damage happens in the timing, not in the data. Measured 2026-08-03: a
# fresh stream was clean for minutes under identical load, then started again.
# With tsched off the device raises an interrupt when it needs data and nothing
# has to be guessed.
#
# api.alsa.headroom — USB is a batch device: the controller only takes whole
# isochronous slots, so a late wakeup cannot be caught up the way it can on a
# PCI card. Headroom 0 (the default) aims at the last possible moment.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb.*" }
      { node.name = "~alsa_input.usb.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.period-size    = 256
        api.alsa.period-num     = 16
        api.alsa.headroom       = 1024
      }
    }
  }
]
