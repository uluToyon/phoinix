# Written by phoinix stage 2.
#
# Hand DNS to systemd-resolved instead of letting NetworkManager write
# /etc/resolv.conf itself. NM would auto-detect a running resolved anyway, but
# an implicit default is not a decision — and this one carries a reason.
#
# The reason is the split tunnel. Proton's WireGuard configs set
# `DNS = 10.2.0.1`, a resolver that only exists inside the tunnel. With a
# single global resolv.conf there are only bad options: either every process
# resolves through the tunnel (and a dropped tunnel stalls the whole desktop in
# lookup timeouts), or qBittorrent resolves past it and leaks every tracker
# name to the ISP — while the nftables rule would drop those queries anyway,
# leaving qBittorrent unable to resolve anything at all.
#
# resolved removes the dilemma: it keeps DNS per link. While the tunnel is up
# it is authoritative; when it goes away resolved falls back to the LAN
# resolver immediately, without the timeouts. See docs/LOG.md 2026-07-31.
[main]
dns=systemd-resolved
