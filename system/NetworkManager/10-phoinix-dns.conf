# Written by phoinix stage 2.
#
# Hand DNS to systemd-resolved instead of letting NetworkManager write
# /etc/resolv.conf itself. NM would auto-detect a running resolved anyway, but
# an implicit default is not a decision — and this one carries a reason.
#
# The reason is the split tunnel. Proton's WireGuard configs set
# `DNS = 10.2.0.1`, a resolver that only exists inside the tunnel. With a
# single global resolv.conf there are only bad options: either every process
# resolves through the tunnel (and a dropped tunnel stalls the whole desktop in
# lookup timeouts), or qBittorrent resolves past it and leaks every tracker
# name to the ISP — while the nftables rule would drop those queries anyway,
# leaving qBittorrent unable to resolve anything at all.
#
# resolved removes the dilemma: it keeps DNS per link, so the routing of a
# NAME is a decision this repo makes rather than a side effect of which
# interface happens to be up.
#
# It was decided wrongly at first, and the correction is worth reading before
# changing anything here. Until 2026-08-01 the tunnel was left "authoritative
# while it is up" — which meant the WHOLE desktop resolved through Proton
# whenever qBittorrent was protected. The packets were separated correctly the
# entire time; only the lookups were not, so it never looked broken. What it
# did look like was Switzerland: CDNs place a client by the resolver that asks,
# so ulu's browser got Swiss edges while his traffic left via Vodafone.
#
# Now: the tunnel carries no resolver at all, and stage 3 section 7c puts
# Quad9-over-TLS on the wired link with the LAN router restricted to its own
# DHCP domain. See docs/LOG.md 2026-07-31 and 2026-08-01.
[main]
dns=systemd-resolved
