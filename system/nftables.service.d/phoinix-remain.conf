# Written by phoinix stage 2. A drop-in, not an edited unit, so pacman
# upgrades of the nftables package keep working (same reasoning as the
# plasmashell shutdown drop-in).
#
# Arch ships nftables.service as a bare Type=oneshot: it runs `nft -f
# /etc/nftables.conf` and then goes inactive, while the ruleset it loaded stays
# in the kernel. The unit's state therefore says nothing about whether the
# machine is protected — and scripts/qbittorrent-vpn.sh refuses to launch
# qBittorrent unless it can confirm that something enforces the tunnel.
# Without this drop-in that check reports "not active" on a perfectly healthy
# system and qBittorrent never starts at all. Found in the QEMU VM, where the
# rule was demonstrably loaded and `is-active` still said inactive.
#
# RemainAfterExit makes the state mean what the check assumes:
#   rules loaded          -> active   -> qBittorrent may start
#   ExecStart failed      -> failed   -> qBittorrent refuses (the case that matters:
#                                        a missing group makes nft reject the
#                                        WHOLE ruleset, leaving nothing enforced)
#   unit stopped by hand  -> inactive -> qBittorrent refuses, over-cautiously,
#                                        since the packaged unit has no ExecStop
#                                        and the rules actually survive. Erring
#                                        toward refusing is the right direction.
[Service]
RemainAfterExit=yes
