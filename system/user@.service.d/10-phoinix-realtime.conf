# Realtime limits for the user session manager. PipeWire's module-rt asks for
# nice -11 and SCHED_FIFO 88 at every start; without these it is refused and all
# audio threads run SCHED_OTHER, which costs xruns under game load.
#
# Set here rather than via rtkit: rtkit demands a finite RLIMIT_RTTIME and the
# kernel then SIGKILLs any realtime thread that overruns it -- that is what
# destroyed WirePlumber on 2026-08-02 (23 kills in 90 s, every ALSA device
# gone). Through rlimits PipeWire keeps rt.time = -1 and no such kill exists.
#
# limits.d does NOT cover this: user@.service is started by PID 1, not through
# PAM, so pipewire.service would never see the limits.conf values.
[Service]
LimitRTPRIO=95
LimitMEMLOCK=infinity
LimitNICE=-19
